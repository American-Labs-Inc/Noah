[Unit]
# Run the pinmux pad writes as early as possible (default ordering ran them at
# ~12s; local-fs.target waits ~8.5s for docker mounts). devmem only needs
# /dev/mem (devtmpfs, up pre-systemd) + busybox (root fs), so gate on the root
# mount only - this is what lets noah-splash paint before the boot CPU storm.
DefaultDependencies=no
RequiresMountsFor=/usr/bin/busybox
Before=noah-splash.service shutdown.target
Conflicts=shutdown.target
